name: Verify service and API contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify service and official fixture integrity
        run: python -m unittest discover -s tests -v
      - name: Check service types
        run: python -m mypy service scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: python -m scripts.generate_openapi
      - run: npm run generate:api
        working-directory: client
      - run: npm run typecheck
        working-directory: client
      - name: Check generated contract drift
        run: git diff --exit-code -- service/openapi/v1.json client/src/generated/api.ts
